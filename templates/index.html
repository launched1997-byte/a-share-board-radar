<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>A股打板雷达 V1.2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:25px;font-weight:800}.sub{color:#8b949e;font-size:12px;margin-top:4px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#238636;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:18px 0}.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:13px}.label{font-size:12px;color:#8b949e}.num{font-size:24px;font-weight:800;margin-top:5px}.status{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:13px;margin-bottom:14px;line-height:1.5}.ok{border-color:#238636}.bad{border-color:#da3633}.tablebox{background:#161b22;border:1px solid #30363d;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #21262d;font-size:13px}th{color:#8b949e;font-size:12px}.score{font-size:18px;font-weight:800}.green{color:#3fb950}.yellow{color:#d29922}.red{color:#f85149}.muted{color:#8b949e;font-size:12px}.empty{text-align:center;padding:32px 15px;color:#8b949e}.rules{margin-top:14px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px}.rules b{display:block;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #30363d;border-radius:999px;padding:6px 9px;font-size:12px;color:#c9d1d9}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.title{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="title">🔥 A股打板雷达</div><div class="sub">V1.2 · 多行情源收盘接力筛选器</div></div>
    <button class="btn" onclick="loadData()">↻ 刷新</button>
  </div>

  <div class="grid" id="cards">
    <div class="card"><div class="label">今日涨停</div><div class="num">—</div></div>
    <div class="card"><div class="label">昨日涨停</div><div class="num">—</div></div>
    <div class="card"><div class="label">候选</div><div class="num">—</div></div>
    <div class="card"><div class="label">接力≥85</div><div class="num">—</div></div>
    <div class="card"><div class="label">行情源</div><div class="num" style="font-size:13px">—</div></div>
  </div>

  <div id="status" class="status">正在连接行情服务……</div>

  <div class="tablebox">
    <table>
      <thead><tr><th>#</th><th>股票</th><th>板</th><th>接力分</th><th>换手</th><th>量比</th><th>成交额(亿)</th><th>风险</th><th>信号</th></tr></thead>
      <tbody id="stocks"><tr><td colspan="9" class="empty">等待行情数据</td></tr></tbody>
    </table>
  </div>

  <div class="rules">
    <b>当前评分</b>
    <div class="chips">
      <span class="chip">换手 15</span><span class="chip">量能 15</span><span class="chip">成交额 10</span><span class="chip">收盘/封板 15</span><span class="chip">涨停强度 15</span><span class="chip">流动性 10</span>
    </div>
    <p class="muted">≥85 且风险&lt;50：强接力；≥80：重点观察；≥70：等确认。当前版本先解决稳定取数；精确N板、概念龙头、竞价与盘中炸板/回封将在实时行情源接入后继续升级。</p>
  </div>
  <p id="note" class="muted"></p>
</div>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
async function loadData(){
 const status=document.getElementById('status');
 status.className='status';status.textContent='正在获取 A 股行情……';
 try{
  const r=await fetch('/api/scan?x='+Date.now(),{cache:'no-store'}); const d=await r.json();
  const rows=d.candidates||[];
  const strong=rows.filter(x=>x.score>=85).length;
  document.getElementById('cards').innerHTML=`<div class="card"><div class="label">今日涨停</div><div class="num">${d.limit_up??'—'}</div></div><div class="card"><div class="label">昨日涨停</div><div class="num">${d.yesterday_limit_up??'—'}</div></div><div class="card"><div class="label">候选</div><div class="num">${rows.length}</div></div><div class="card"><div class="label">接力≥85</div><div class="num">${strong}</div></div><div class="card"><div class="label">行情源</div><div class="num" style="font-size:12px">${esc(d.source||'—')}</div></div>`;
  document.getElementById('status').className='status '+(d.ok?'ok':'bad');
  document.getElementById('status').textContent=d.ok?('✓ 行情服务连接正常 · '+d.source):('⚠ 行情源暂不可用：'+(d.error||'未知错误'));
  document.getElementById('stocks').innerHTML=rows.length?rows.map((x,i)=>{let c=x.signal==='强接力'?'green':x.signal==='放弃'?'red':'yellow';return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b><div class="muted">${esc(x.code)}</div></td><td>${x.board}板</td><td class="score">${x.score}</td><td>${Number(x.turnover).toFixed(2)}%</td><td>${Number(x.volume_ratio).toFixed(2)}</td><td>${Number(x.amount).toFixed(2)}</td><td>${x.risk}</td><td class="${c}"><b>${esc(x.signal)}</b></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">当前没有可展示的候选。行情恢复后点击“刷新”。</td></tr>';
  const errs=(d.source_errors||[]).join('；');
  document.getElementById('note').textContent=(d.note||'')+(errs?(' 数据源尝试记录：'+errs):'');
 }catch(e){status.className='status bad';status.textContent='⚠ 网页接口异常：'+e;}
}
loadData();
</script>
</body></html>
