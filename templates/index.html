<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股打板雷达 V4.0</title><style>body{margin:0;background:#0b0f14;color:#e6edf3;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:800}.sub,.muted{color:#8b949e;font-size:12px}.btn{background:#238636;color:white;border:0;border-radius:8px;padding:9px 14px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}.card,.status,.panel,.table{background:#111820;border:1px solid #29313b;border-radius:10px;padding:12px}.num{font-size:22px;font-weight:800;margin-top:5px}.ok{border-color:#238636}.bad{border-color:#da3633}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #30363d;border-radius:99px;padding:5px 8px;font-size:11px}.table{overflow:auto;padding:0}table{width:100%;min-width:1050px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #21262d;text-align:left}th{color:#8b949e;font-size:11px}.score{font-size:18px;font-weight:800}.green{color:#3fb950}.yellow{color:#d29922}.red{color:#f85149}.tag{border:1px solid #30363d;border-radius:5px;padding:2px 5px;font-size:11px}.empty{text-align:center;padding:30px;color:#8b949e}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}} </style><body><div class="wrap"><div class="top"><div><div class="title">🔥 A股打板雷达</div><div class="sub">V4.0 · 打板 / 冲板 / 异动</div></div><button class="btn" onclick="load()">↻ 刷新</button></div><div id="cards" class="cards"></div><div id="status" class="status">正在获取行情……</div><div class="panel"><b>V4 三层雷达</b><div class="chips"><span class="chip">🔴 打板池：已涨停</span><span class="chip">🟠 冲板池：接近涨停</span><span class="chip">🟡 异动池：快速拉升</span><span class="chip">换手</span><span class="chip">量比</span><span class="chip">成交额</span><span class="chip">机会分</span><span class="chip">风险分</span></div><p class="muted">重点捕捉类似“日内低点明显、快速拉升、距离涨停较近”的盘中强势股。N板、竞价、炸板、回封未接入真实历史/Tick前不伪造。</p></div><div class="table"><table><thead><tr><th>#</th><th>股票</th><th>池</th><th>机会</th><th>风险</th><th>换手</th><th>量比</th><th>成交额亿</th><th>涨幅</th><th>日内拉升</th><th>距涨停</th><th>信号</th></tr></thead><tbody id="rows"><tr><td colspan="12" class="empty">等待数据</td></tr></tbody></table></div><p id="note" class="muted"></p></div><script>const e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){let st=document.getElementById('status');st.className='status';st.textContent='正在获取 A 股行情……';try{let r=await fetch(location.origin+'/api/scan?x='+Date.now(),{cache:'no-store'}),d=await r.json(),a=d.candidates||[],z=d.stats||{};document.getElementById('cards').innerHTML=`<div class="card"><div class="muted">打板池</div><div class="num">${z.limit_up??0}</div></div><div class="card"><div class="muted">冲板池</div><div class="num">${z.surge??0}</div></div><div class="card"><div class="muted">异动池</div><div class="num">${z.abnormal??0}</div></div><div class="card"><div class="muted">行情源</div><div class="num" style="font-size:12px">${e(d.source||'—')}</div></div>`;st.className='status '+(d.ok?'ok':'bad');st.textContent=d.ok?'✓ '+e(d.source)+' · '+e(d.updated_at):'⚠ '+e(d.error||'行情不可用');document.getElementById('rows').innerHTML=a.length?a.map((x,i)=>`<tr><td>${i+1}</td><td><b>${e(x.name)}</b><div class="muted">${e(x.code)}</div></td><td><span class="tag">${e(x.stage)}</span></td><td class="score">${x.score}</td><td>${x.risk}</td><td>${Number(x.turnover||0).toFixed(2)}%</td><td>${Number(x.volume_ratio||0).toFixed(2)}</td><td>${Number(x.amount||0).toFixed(2)}</td><td>${Number(x.pct||0).toFixed(2)}%</td><td>${Number(x.intraday_gain||0).toFixed(2)}%</td><td>${Number(x.distance_to_limit||0).toFixed(2)}%</td><td>${e(x.signal)}</td></tr>`).join(''):'<tr><td colspan="12" class="empty">当前没有符合条件的股票</td></tr>';document.getElementById('note').textContent=d.note||''}catch(x){st.className='status bad';st.textContent='⚠ '+e(x.message||x);}}load();</script></body></html>
