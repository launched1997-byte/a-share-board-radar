<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股全景雷达 V2</title><style>*{box-sizing:border-box}body{margin:0;background:#09111f;color:#edf3ff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1220px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.muted{color:#8fa2be;font-size:12px}.btn{background:#163c34;color:#63e6be;border:1px solid #296457;border-radius:9px;padding:9px 14px;font-weight:700}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:45px;padding:45px 0}.eyebrow{color:#63e6be;font-size:11px;letter-spacing:2px}.hero h1{font-size:48px;line-height:1.15;margin:10px 0}.hero h1 em{color:#79a7ff;font-style:normal}.search{width:100%;background:#101d31;border:1px solid #263b5a;border-radius:14px;padding:17px;color:#fff;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#0e1929;border:1px solid #20314b;border-radius:17px;padding:20px}.card{cursor:pointer}.card:hover{border-color:#547aaa;transform:translateY(-2px)}.icon{font-size:28px}.score{float:right;color:#63e6be}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.chip,.tag{background:#17253a;color:#a9bad2;border-radius:14px;padding:5px 8px;font-size:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:35px}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #1c2a41}.row:last-child{border:0}.modal{display:none;position:fixed;inset:0;background:#000a;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(700px,100%);max-height:80vh;overflow:auto;background:#101c2f;border:1px solid #2b405f;border-radius:18px;padding:28px}.stock{padding:12px 0;border-bottom:1px solid #24354e}.close{float:right;background:none;border:0;color:#fff;font-size:24px}.section{margin-top:40px}@media(max-width:760px){.hero,.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">◉ A股全景雷达 <span class="muted">V2</span></div><div class="muted">产业逻辑 × 连板雷达 × 候选池</div></div><button class="btn" onclick="loadAll()">↻ 刷新</button></div><section class="hero"><div><p class="eyebrow">A-SHARE PANORAMA × BOARD RADAR</p><h1>从产业逻辑<br><em>找到交易机会</em></h1><p class="muted">产业链地图、概念导航、个股搜索与现有连板扫描系统整合。</p></div><div><input id="search" class="search" placeholder="搜索股票、代码、概念，例如 CPO / 002371" oninput="searchStock(this.value)"><div id="results"></div></div></section><section><h2>🗺️ A股产业全景地图</h2><div id="themes" class="grid"><div class="muted">加载中…</div></div></section><section class="two"><div class="panel"><h2>🔥 产业强度</h2><div id="rank"></div></div><div class="panel"><h2>🎯 全景高分候选</h2><div id="pool"></div></div></section><section class="section"><h2>🚀 原有连板雷达</h2><div class="panel"><div id="radar" class="muted">正在加载连板扫描结果…</div></div></section></main><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="detail"></div></div></div><script>let P={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function loadAll(){try{let d=await fetch('/api/panorama?x='+Date.now()).then(r=>r.json());P=d;document.getElementById('themes').innerHTML=d.themes.map(t=>`<article class="card" onclick="openTheme('${t.id}')"><span class="icon">${t.icon}</span><span class="score">${t.avg_score}分</span><h3>${t.name}</h3><p class="muted">${t.description}</p><div class="chips">${t.children.map(x=>`<span class="chip">${x}</span>`).join('')}</div></article>`).join('');document.getElementById('rank').innerHTML=d.sector_rank.map((x,i)=>`<div class="row"><span>#${i+1}　${x.name}</span><b class="score">${x.score}</b></div>`).join('');document.getElementById('pool').innerHTML=d.candidates.slice(0,8).map(x=>`<div class="row"><span><b>${x.name}</b><span class="muted"> ${x.code} · ${x.theme}</span></span><b class="score">${x.score}</b></div>`).join('')}catch(e){document.getElementById('themes').textContent=e.message}try{let r=await fetch('/api/scan?x='+Date.now()).then(x=>x.json());let a=r.top10||[];document.getElementById('radar').innerHTML=a.length?a.map(x=>`<div class="row"><span><b>${esc(x.name)}</b> <span class="muted">${esc(x.code)} · ${esc(x.sector||'未分类')}</span></span><b class="score">${x.score}</b></div>`).join(''):'当前暂无可靠候选：'+esc(r.error||r.note||'');}catch(e){document.getElementById('radar').textContent='雷达接口异常：'+e.message}}function openTheme(id){let t=P.themes.find(x=>x.id===id);document.getElementById('detail').innerHTML=`<p class="eyebrow">${t.icon} INDUSTRY CHAIN</p><h2>${t.name}</h2><p class="muted">${t.description}</p><div class="chips">${t.children.map(x=>`<span class="chip">${x}</span>`).join('')}</div><h3>公司池</h3>${t.stocks.map(s=>`<div class="stock"><b>${s.name}</b> <span class="muted">${s.code} · ${s.tags.join('/')}</span><b class="score">${s.score}分</b></div>`).join('')}`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}async function searchStock(q){let box=document.getElementById('results');if(!q.trim()){box.innerHTML='';return}let a=await fetch('/api/search?q='+encodeURIComponent(q)).then(r=>r.json());box.innerHTML=a.map(x=>`<div class="card" style="margin-top:6px;padding:10px"><b>${x.name}</b> <span class="muted">${x.code} · ${x.theme}</span></div>`).join('')||'<p class="muted">暂无匹配</p>'}loadAll();</script></body></html>
