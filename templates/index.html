<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股打板雷达</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101318;color:#fff;margin:0;padding:16px}.wrap{max-width:900px;margin:auto}h1{font-size:24px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#1b2028;padding:14px;border-radius:12px}.num{font-size:24px;font-weight:700}button{background:#2878ff;color:#fff;border:0;border-radius:8px;padding:10px 14px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px 6px;border-bottom:1px solid #292f38;font-size:13px}.small{color:#8c95a1;font-size:12px}.green{color:#42df83}.yellow{color:#e7cf55}.red{color:#ff6c6c}@media(max-width:600px){th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}</style>
</head><body><div class="wrap"><h1>🔥 A股打板雷达</h1><div class="small">收盘连板候选扫描</div><p><button onclick="loadData()">刷新</button> <span id="time" class="small"></span></p><div id="cards" class="cards"></div><table><thead><tr><th>#</th><th>股票</th><th>板</th><th>分数</th><th>换手</th><th>量比</th><th>信号</th></tr></thead><tbody id="stocks"></tbody></table><p id="note" class="small"></p></div>
<script>
async function loadData(){const r=await fetch('/api/scan?x='+Date.now());const d=await r.json();document.getElementById('time').textContent=d.updated_at||'';document.getElementById('cards').innerHTML=`<div class="card"><div class="small">今日涨停</div><div class="num">${d.limit_up||0}</div></div><div class="card"><div class="small">昨日涨停</div><div class="num">${d.yesterday_limit_up||0}</div></div><div class="card"><div class="small">候选</div><div class="num">${(d.candidates||[]).length}</div></div>`;document.getElementById('stocks').innerHTML=(d.candidates||[]).map((x,i)=>{let c=x.signal==='强接力'?'green':x.signal==='放弃'?'red':'yellow';return `<tr><td>${i+1}</td><td><b>${x.name}</b><div class="small">${x.code}</div></td><td>${x.board}板</td><td><b>${x.score}</b></td><td>${x.turnover.toFixed(2)}%</td><td>${x.volume_ratio.toFixed(2)}</td><td class="${c}">${x.signal}</td></tr>`}).join('');document.getElementById('note').textContent=d.note||d.error||''}loadData();
</script></body></html>
