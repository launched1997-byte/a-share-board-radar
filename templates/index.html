<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A股打板雷达 V2.1</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px 12px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:24px;font-weight:850}.sub,.muted{color:#8b949e;font-size:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#238636;color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:15px 0}.card,.status,.panel,.tablebox{background:#111820;border:1px solid #29313b;border-radius:12px}.card{padding:12px}.label{font-size:11px;color:#8b949e}.num{font-size:21px;font-weight:800;margin-top:5px}.status{padding:12px;margin-bottom:10px}.ok{border-color:#238636}.bad{border-color:#da3633}.panel{padding:12px;margin-bottom:10px}.panel b{display:block;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #30363d;border-radius:999px;padding:5px 8px;font-size:11px;color:#c9d1d9}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #21262d;font-size:13px}th{color:#8b949e;font-size:11px}.score{font-size:18px;font-weight:850}.green{color:#3fb950}.yellow{color:#d29922}.red{color:#f85149}.tag{display:inline-block;border:1px solid #30363d;border-radius:6px;padding:2px 5px;font-size:10px}.empty{text-align:center;padding:30px;color:#8b949e}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:21px}.grid .card:last-child{grid-column:span 2}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">🔥 A股打板雷达</div><div class="sub">V2.1 · 连板接力筛选器</div></div><button class="btn" onclick="loadData()">↻ 刷新</button></div><div class="grid" id="cards"><div class="card"><div class="label">今日涨停</div><div class="num">—</div></div><div class="card"><div class="label">候选</div><div class="num">—</div></div><div class="card"><div class="label">强接力</div><div class="num">—</div></div><div class="card"><div class="label">重点观察</div><div class="num">—</div></div><div class="card"><div class="label">行情源</div><div class="num" style="font-size:12px">—</div></div></div><div id="status" class="status">正在连接行情服务……</div><div class="panel"><b>当前模型</b><div class="chips"><span class="chip">连板/涨停识别</span><span class="chip">换手 15</span><span class="chip">量比 15</span><span class="chip">成交额 10</span><span class="chip">收盘强度 15</span><span class="chip">涨停 15</span><span class="chip">流动性 10</span><span class="chip">风险独立评分</span></div><p class="muted">强接力 = 分数≥85且风险&lt;50。没有历史连续板数据时，系统明确标记“今日涨停”，不伪造几板。</p></div><div class="tablebox"><table><thead><tr><th>#</th><th>股票</th><th>板型</th><th>接力分</th><th>风险</th><th>换手</th><th>量比</th><th>成交额(亿)</th><th>涨幅</th><th>信号</th></tr></thead><tbody id="stocks"><tr><td colspan="10" class="empty">等待行情数据</td></tr></tbody></table></div><p id="note" class="muted"></p></div><script>function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]})}async function loadData(){var status=document.getElementById('status');status.className='status';status.textContent='正在获取 A 股行情……';try{var r=await fetch(window.location.origin+'/api/scan?x='+Date.now(),{cache:'no-store'});var text=await r.text();var d=JSON.parse(text);var rows=d.candidates||[];var strong=rows.filter(x=>x.signal==='强接力').length;var watch=rows.filter(x=>x.signal==='重点观察').length;document.getElementById('cards').innerHTML='<div class="card"><div class="label">今日涨停</div><div class="num">'+(d.limit_up??'—')+'</div></div><div class="card"><div class="label">候选</div><div class="num">'+rows.length+'</div></div><div class="card"><div class="label">强接力</div><div class="num">'+strong+'</div></div><div class="card"><div class="label">重点观察</div><div class="num">'+watch+'</div></div><div class="card"><div class="label">行情源</div><div class="num" style="font-size:12px">'+esc(d.source||'—')+'</div></div>';status.className='status '+(d.ok?'ok':'bad');status.textContent=d.ok?'✓ 行情正常 · '+esc(d.source||'多源')+' · '+esc(d.updated_at||''):'⚠ '+esc(d.error||'行情源暂不可用');document.getElementById('stocks').innerHTML=rows.length?rows.map(function(x,i){var c=x.signal==='强接力'?'green':x.signal==='放弃'?'red':'yellow';return '<tr><td>'+(i+1)+'</td><td><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.code)+'</div></td><td><span class="tag">'+esc(x.board_text||'今日涨停')+'</span></td><td class="score">'+x.score+'</td><td>'+x.risk+'</td><td>'+Number(x.turnover||0).toFixed(2)+'%</td><td>'+Number(x.volume_ratio||0).toFixed(2)+'</td><td>'+Number(x.amount||0).toFixed(2)+'</td><td>'+Number(x.pct||0).toFixed(2)+'%</td><td class="'+c+'"><b>'+esc(x.signal)+'</b></td></tr>'}).join(''):'<tr><td colspan="10" class="empty">当前没有可展示的涨停候选。</td></tr>';document.getElementById('note').textContent=d.note||''}catch(e){status.className='status bad';status.textContent='⚠ 网页接口异常：'+(e&&e.message?e.message:String(e));document.getElementById('stocks').innerHTML='<tr><td colspan="10" class="empty">行情暂时无法读取，请稍后刷新。</td></tr>'}}loadData();</script></body></html>
