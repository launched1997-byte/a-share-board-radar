<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股全景研究</title><style>
:root{--bg:#0a0f17;--panel:#111927;--line:#253248;--text:#eef4ff;--muted:#91a0b8;--accent:#4f8cff;--hot:#ff5d68;--gold:#e6b85c;--blue:#4aa3ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0a0f17,#0c1420);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1320px;margin:auto;padding:18px}.hero{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;margin:8px 0 18px}.brand{font-size:28px;font-weight:850;letter-spacing:.3px}.sub{color:var(--muted);margin-top:7px}.actions{display:flex;gap:8px}.btn{background:#172338;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent)}.search{position:sticky;top:8px;z-index:5;margin-bottom:14px}.search input{width:100%;padding:15px 18px;border-radius:13px;border:1px solid var(--line);background:#0f1724;color:var(--text);font-size:15px;outline:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.chip{border:1px solid var(--line);background:#101a29;color:#cbd7e8;border-radius:999px;padding:7px 11px;cursor:pointer}.chip.active{background:#20375c;border-color:#5c91dc;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.topic{background:linear-gradient(145deg,#111a28,#0e1724);border:1px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;transition:.18s}.topic:hover{transform:translateY(-2px);border-color:#4d78b8}.topic-top{display:flex;justify-content:space-between;gap:8px}.topic h3{margin:0;font-size:17px}.badge{font-size:11px;color:var(--gold);border:1px solid #6b5730;border-radius:999px;padding:3px 7px;white-space:nowrap}.desc{color:var(--muted);line-height:1.6;margin:10px 0}.nodes{display:flex;flex-wrap:wrap;gap:6px}.node{font-size:12px;border:1px solid #2a3950;color:#b9c8da;padding:4px 7px;border-radius:7px}.legend{display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:18px 0}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.hot{background:var(--hot)}.blue{background:var(--blue)}.gold{background:var(--gold)}.drawer{position:fixed;inset:0;background:rgba(2,5,10,.68);display:none;align-items:flex-end;justify-content:center;z-index:20}.drawer.open{display:flex}.sheet{width:min(920px,100%);max-height:86vh;overflow:auto;background:#0f1724;border:1px solid #30415b;border-radius:20px 20px 0 0;padding:20px}.sheet-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.sheet h2{margin:0}.close{font-size:22px;background:none;border:0;color:#fff;cursor:pointer}.chain{margin:16px 0;padding:12px;background:#0b121d;border:1px solid #223149;border-radius:12px}.chain-row{display:flex;gap:8px;overflow:auto;padding:4px}.chain-item{min-width:150px;padding:10px;border-radius:10px;background:#132036;border:1px solid #2a3c56}.company-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.company{padding:11px;background:#101b2b;border:1px solid #26364c;border-radius:10px}.company b{display:block}.company span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}.note{color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid var(--line);margin-top:22px;padding-top:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{flex-direction:column}.actions{width:100%}.btn{flex:1}}@media(max-width:600px){.wrap{padding:12px}.brand{font-size:23px}.grid{grid-template-columns:1fr}.company-list{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><div><div class="brand">A股全景研究</div><div class="sub">产业链 · 概念导航 · 公司资料 · 与连板雷达独立并行</div></div><div class="actions"><a class="btn" href="/">返回连板雷达</a><button class="btn primary" onclick="resetAll()">全部专题</button></div></section><div class="search"><input id="q" placeholder="搜索概念、产业链环节、公司或代码，例如：PCB、液冷、光模块" oninput="render()"></div><div class="toolbar" id="toolbar"></div><section class="grid" id="grid"></section><div class="legend"><span><i class="dot hot"></i>高关注方向</span><span><i class="dot blue"></i>已有公司资料</span><span><i class="dot gold"></i>持续补充</span></div><div class="note">本页面为独立开发的公开资料研究导航，产业分类与公司示例仅用于研究整理，不构成投资建议。后续可接入你的连板雷达、实时行情和自选股系统。</div></main><div class="drawer" id="drawer" onclick="if(event.target===this)closeSheet()"><section class="sheet"><div class="sheet-head"><div><h2 id="title"></h2><div class="sub" id="subtitle"></div></div><button class="close" onclick="closeSheet()">×</button></div><div class="chain"><b>产业链拆解</b><div class="chain-row" id="chain"></div></div><h3>公司观察池</h3><div class="company-list" id="companies"></div></section></div><script>
const topics=[
{id:'ai',name:'AI算力基础设施',tag:'高关注',desc:'服务器、液冷、电源、连接器、数据中心配套等。',nodes:['AI服务器','液冷','UPS','连接器','数据中心'],chain:['芯片','服务器','散热','供电','网络'],companies:[['浪潮信息','000977','服务器'],['工业富联','601138','算力基础设施'],['英维克','002837','液冷温控']]},
{id:'cpo',name:'光模块 / CPO',tag:'研究中',desc:'高速光模块、硅光、光引擎、封装耦合与测试验证。',nodes:['800G/1.6T','硅光','光引擎','封装','测试'],chain:['光源','PIC','耦合','封装','测试'],companies:[['中际旭创','300308','高速光模块'],['新易盛','300502','光模块'],['天孚通信','300394','光器件']]},
{id:'pcb',name:'PCB / 高速互连',tag:'高关注',desc:'高速PCB、HDI、覆铜板、铜箔及服务器链条。',nodes:['高速PCB','HDI','IC载板','CCL','铜箔'],chain:['树脂','覆铜板','铜箔','PCB','组装'],companies:[['沪电股份','002463','高速PCB'],['深南电路','002916','PCB/封装基板'],['生益科技','600183','覆铜板']]},
{id:'semi-eq',name:'半导体设备',tag:'持续补充',desc:'刻蚀、薄膜沉积、清洗、CMP、量测检测等。',nodes:['刻蚀','薄膜','清洗','CMP','检测'],chain:['前道设备','核心工艺','量测','封测','验证'],companies:[['北方华创','002371','半导体设备'],['中微公司','688012','刻蚀设备'],['盛美上海','688082','清洗设备']]},
{id:'semi-mat',name:'半导体材料',tag:'研究中',desc:'硅片、电子特气、靶材、CMP材料与湿电子化学品。',nodes:['硅片','电子特气','靶材','CMP','光刻胶'],chain:['原材料','纯化','功能材料','晶圆制造','封装'],companies:[['沪硅产业','688126','半导体硅片'],['安集科技','688019','CMP材料'],['鼎龙股份','300054','半导体材料']]},
{id:'pack',name:'先进封装 / Chiplet',tag:'高关注',desc:'先进封装、封测、Chiplet与配套材料设备。',nodes:['2.5D/3D','Chiplet','封测','基板','测试'],chain:['晶圆','先进封装','互连','测试','成品'],companies:[['通富微电','002156','封测'],['长电科技','600584','先进封装'],['华天科技','002185','封装测试']]},
{id:'mlcc',name:'MLCC / 被动元件',tag:'持续补充',desc:'MLCC、电感、电容、电子材料与产业配套。',nodes:['MLCC','电感','电容','电子材料'],chain:['粉体','介质材料','元件制造','模组','终端'],companies:[['风华高科','000636','MLCC'],['三环集团','300408','电子元件材料'],['顺络电子','002138','电感']]},
{id:'grid',name:'电网 / 特高压',tag:'高关注',desc:'特高压、变压器、开关设备、电网自动化与线缆。',nodes:['特高压','变压器','开关','线缆','自动化'],chain:['发电','输电','变电','配电','用电'],companies:[['特变电工','600089','变压器'],['许继电气','000400','电网设备'],['平高电气','600312','高压开关']]},
{id:'robot',name:'机器人产业链',tag:'研究中',desc:'人形机器人、执行器、减速器、丝杠、传感器。',nodes:['减速器','丝杠','执行器','传感器'],chain:['材料','核心零部件','执行器','整机','应用'],companies:[['汇川技术','300124','工业自动化'],['双环传动','002472','减速器'],['绿的谐波','688017','减速器']]},
{id:'drug',name:'创新药 / CXO',tag:'持续补充',desc:'创新药研发、临床管线、CXO/CDMO与商业化。',nodes:['创新药','CXO','CDMO','原料药'],chain:['靶点','研发','临床','生产','商业化'],companies:[['药明康德','603259','CXO'],['恒瑞医药','600276','创新药'],['凯莱英','002821','CDMO']]}
];
let active='all';function toolbar(){let names=['全部',...topics.map(x=>x.name)];document.getElementById('toolbar').innerHTML=names.map((x,i)=>`<button class="chip ${((i===0?'all':topics[i-1].id)===active)?'active':''}" onclick="active='${i===0?'all':topics[i-1].id}';render()">${x}</button>`).join('')}function render(){toolbar();let q=document.getElementById('q').value.trim().toLowerCase();let list=topics.filter(x=>(active==='all'||x.id===active)&&(!q||[x.name,x.desc,...x.nodes,...x.chain,...x.companies.flat()].join(' ').toLowerCase().includes(q)));document.getElementById('grid').innerHTML=list.length?list.map(x=>`<article class="topic" onclick="openTopic('${x.id}')"><div class="topic-top"><h3>${x.name}</h3><span class="badge">${x.tag}</span></div><div class="desc">${x.desc}</div><div class="nodes">${x.nodes.map(n=>`<span class="node">${n}</span>`).join('')}</div></article>`).join(''):'<div class="empty">没有找到匹配内容</div>'}function openTopic(id){let x=topics.find(a=>a.id===id);document.getElementById('title').textContent=x.name;document.getElementById('subtitle').textContent=x.desc;document.getElementById('chain').innerHTML=x.chain.map((n,i)=>`<div class="chain-item">${i+1}. ${n}</div>`).join('');document.getElementById('companies').innerHTML=x.companies.map(c=>`<div class="company"><b>${c[0]}</b><span>${c[1]} · ${c[2]}</span></div>`).join('');document.getElementById('drawer').classList.add('open')}function closeSheet(){document.getElementById('drawer').classList.remove('open')}function resetAll(){active='all';document.getElementById('q').value='';render()}render();</script></body></html>
