<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A股连板雷达 V7.0</title><style>body{margin:0;background:#0b0f14;color:#e6edf3;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1150px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:800}.muted{color:#8b949e;font-size:12px}.btn{background:#238636;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:15px 0}.card,.status{background:#111820;border:1px solid #29313b;border-radius:10px;padding:12px}.num{font-size:22px;font-weight:800;margin-top:5px}.ok{border-color:#238636}.bad{border-color:#da3633}.section{margin:14px 0}.section h2{font-size:16px;margin:8px 0}.sectors{display:flex;gap:8px;overflow:auto}.sector{min-width:160px;background:#111820;border:1px solid #29313b;border-radius:10px;padding:10px}.sector b{display:block}.sector span{font-size:12px;color:#8b949e}.table{overflow:auto;background:#111820;border:1px solid #29313b;border-radius:10px}table{width:100%;min-width:1120px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #21262d;text-align:left}th{color:#8b949e;font-size:11px}.score{font-size:18px;font-weight:800}.tag{border:1px solid #30363d;border-radius:5px;padding:2px 5px;font-size:11px}.empty{text-align:center;padding:30px;color:#8b949e}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.sector{min-width:145px}}</style><body><div class="wrap"><div class="top"><div><div class="title">🔥 A股连板雷达</div><div class="muted">V7.0 · 连板梯队 + 情绪 + 打板候选</div></div><button class="btn" onclick="load()">↻ 刷新</button></div><div id="status" class="status">正在获取行情……</div><div id="cards" class="grid"></div><div class="section"><h2>🔥 强势板块 TOP</h2><div id="sectors" class="sectors"><div class="muted">等待数据</div></div></div><div class="section"><h2>🏆 今日 TOP 10</h2><div class="table"><table><thead><tr><th>#</th><th>股票</th><th>板块</th><th>池</th><th>连板</th><th>机会</th><th>风险</th><th>换手</th><th>量比</th><th>成交额亿</th><th>涨幅</th><th>日内拉升</th><th>信号</th></tr></thead><tbody id="top"><tr><td colspan="13" class="empty">等待数据</td></tr></tbody></table></div></div><div class="section"><h2>📋 完整候选池</h2><div class="table"><table><thead><tr><th>#</th><th>股票</th><th>板块</th><th>池</th><th>连板</th><th>机会</th><th>风险</th><th>换手</th><th>量比</th><th>成交额亿</th><th>涨幅</th><th>距涨停</th><th>信号</th></tr></thead><tbody id="all"><tr><td colspan="13" class="empty">等待数据</td></tr></tbody></table></div></div><p id="note" class="muted"></p></div><script>const e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const row=(x,i,top)=>`<tr><td>${i+1}</td><td><b>${e(x.name)}</b><div class="muted">${e(x.code)}</div></td><td>${e(x.sector||'未分类')}</td><td><span class="tag">${e(x.pool||x.stage)}</span></td><td><b>${e(x.ladder)}</b></td><td class="score">${x.score}</td><td>${x.risk}</td><td>${Number(x.turnover||0).toFixed(2)}%</td><td>${Number(x.volume_ratio||0).toFixed(2)}</td><td>${Number(x.amount||0).toFixed(2)}</td><td>${Number(x.pct||0).toFixed(2)}%</td><td>${top?Number(x.intraday_gain||0).toFixed(2)+'%':Number(x.distance_to_limit||0).toFixed(2)+'%'}</td><td>${e(x.signal)}</td></tr>`;async function load(){let st=document.getElementById('status');st.textContent='正在获取 A 股行情……';try{let r=await fetch(location.origin+'/api/scan?x='+Date.now(),{cache:'no-store'}),d=await r.json(),a=d.candidates||[],z=d.stats||{},s=d.sentiment||{};document.getElementById('cards').innerHTML=`<div class="card"><div class="muted">打板池</div><div class="num">${z.limit_up??0}</div></div><div class="card"><div class="muted">冲板池</div><div class="num">${z.surge??0}</div></div><div class="card"><div class="muted">异动池</div><div class="num">${z.abnormal??0}</div></div><div class="card"><div class="muted">已确认连板</div><div class="num">${z.confirmed_board??0}</div></div><div class="card"><div class="muted">短线情绪</div><div class="num">${e(s.sentiment||'—')}</div><div class="muted">昨日涨停中位数 ${s.yesterday_median_pct==null?'—':Number(s.yesterday_median_pct).toFixed(2)+'%'}</div></div>`;st.className='status '+(d.ok?'ok':'bad');st.textContent=d.ok?'✓ '+e(d.source)+' · '+e(d.updated_at):'⚠ '+e(d.error||'行情不可用');let ss=d.sector_rank||[];document.getElementById('sectors').innerHTML=ss.length?ss.map((x,i)=>`<div class="sector"><b>${i+1}. ${e(x.sector)}</b><span>${x.count}只 · 最强 ${e(x.best_name)} · ${x.sector_score??x.best_score}分</span></div>`).join(''):'<div class="muted">当前数据源没有可靠板块字段，暂不猜测板块。</div>';let top=d.top10||[];document.getElementById('top').innerHTML=top.length?top.map((x,i)=>row(x,i,true)).join(''):'<tr><td colspan="13" class="empty">暂无候选</td></tr>';document.getElementById('all').innerHTML=a.length?a.map((x,i)=>row(x,i,false)).join(''):'<tr><td colspan="13" class="empty">暂无候选</td></tr>';document.getElementById('note').textContent=d.note||''}catch(x){st.className='status bad';st.textContent='⚠ '+e(x.message||x)}}load();</script></body></html>
